# Auto-aim parameters for the 16 Jetson + Intel RealSense D435/D435i robot.
#
# Use this file with the auto_aim_realsense_16.launch.py launch file. Values
# below override the C++ defaults in TrackerConfig and the node parameters.
#
# Where two robots have different physical geometry, override per-robot values
# here. Do NOT mask measurement errors with bore-sight offsets — see
# docs/calibration_guide.md.

auto_aim:
  ros__parameters:
    # ------------------- Detection / tracking -------------------
    target_classes: ["0"]      # Set to this YOLOv26 model's enemy armor ids.
    # YOLO-pose keypoints are the only measurement model. The detector still
    # publishes /detector/armors for legacy debug consumers, but auto_aim only
    # subscribes to /detector/armors_keypoints. See docs/auto_aim_pipeline.md.
    keypoint_topic: "/detector/armors_keypoints"
    # Reject any detection where any of the four keypoints scores below this.
    # 0.30 is a noise-vs-signal threshold for the YOLOv26-pose model; raise
    # toward 0.50 for cleaner static rigs, lower only after measuring the
    # per-keypoint score distribution on a real bag.
    min_keypoint_score: 0.30
    # Mean PnP pixel reprojection error gate (against the keypoints
    # themselves). Values >25 px usually indicate a label mis-correspondence
    # or a degenerate quadrilateral.
    keypoint_max_reproj_error: 15.0
    # Temporary diagnostic override. Keep "auto" for normal operation; force
    # "small" or "large" only to prove whether size flips are causing pose jumps.
    "pnp.force_armor_size": "auto"
    # In auto mode, keep the previous small/large choice when reprojection
    # errors are too close to distinguish geometry reliably. This prevents
    # low-reprojection planar PnP scale flips from becoming 3D pose jumps.
    "pnp.size_switch_margin_px": 0.50
    enable_pnp_health_gate: false
    pnp_max_reproj_err_norm: 0.10
    pnp_min_depth_m: 0.10
    pnp_max_depth_m: 12.0
    # Convex+winding sanity check on the four keypoints. ON by default;
    # disable only for debug rigs where you want to see how mis-ordered
    # keypoints would behave inside PnP.
    enable_keypoint_geometry_check: true
    # Legacy bbox-PnP parameter, kept only because TrackerConfig still owns
    # the field. The keypoint path does not use it.
    light_ratio: 0.85
    max_armor_distance: 8.0
    max_armor_z: 1.2

    # State machine
    confirm_frames: 3
    lost_timeout: 0.4

    # EKF process noise
    q_pos: 5.0
    q_yaw: 10.0
    q_r:  1.0e-6

    # EKF measurement noise (grows with range)
    r_pos_base: 0.05
    r_pos_slope: 0.04
    r_yaw_base: 0.05
    r_yaw_slope: 0.005
    max_oblique_deg: 65.0

    # Velocity damping (per ref_freq frame)
    alpha_pos: 0.90
    alpha_yaw: 0.90
    alpha_coast: 0.70

    # Armor geometry
    initial_radius: 0.24
    radius_ema_alpha: 0.05

    # ------------------- Ballistics / physical -------------------
    # MEASURE bullet speed on the 16 robot. Default 25 m/s is a placeholder.
    bullet_speed: 25.0
    gravity: 9.8

    # 16 Jetson + RealSense robot geometry. Verify with a tape measure.
    gimbal_height: 0.325
    barrel_offset_x: 0.0    # forward [m] (barrel ahead of camera)
    barrel_offset_y: 0.0    # left    [m] (barrel left of camera)
    barrel_offset_z: -0.10  # up      [m] (barrel below camera)

    # ------------------- Fire gate -------------------
    angular_window: 0.09
    # Real robot default: use camera-frame target angle as the final centering
    # gate. For static fake-IMU video tests, override to "disabled" from launch.
    "fire.alignment_source": "camera_angle"
    window_ref_dist: 3.0
    min_fire_dist: 0.3
    max_fire_dist: 8.0

    # ------------------- Timing -------------------
    time_bias: 0.05
    ref_freq: 30.0

    # ------------------- Match / association -------------------
    max_match_dist: 0.5
    maha_threshold: 13.3
    face_jump_max_match_dist_ratio: 1.5
    face_jump_min_yaw: 0.78539816339
    face_jump_max_yaw: 2.35619449019

    # ------------------- Target switching -------------------
    switch_range_ratio: 0.85
    switch_cooldown: 10
    enable_tracking_switch: false
    tracking_switch_range_ratio: 0.80

    # ------------------- Command shaping -------------------
    cmd_smooth_alpha: 0.4
    "cmd.temp_lost_coast_max_s": 0.08

    # ------------------- Gimbal sign convention -------------------
    # Flip these to -1.0 if the microcontroller axis is inverted.
    "gimbal.yaw_sign": 1.0
    "gimbal.pitch_sign": 1.0
    # /micro_imu must be fresh because it defines the camera->odom transform
    # and the current gimbal angles used by the fire gate.
    "micro_imu.stale_threshold_s": 0.25

    # ------------------- Bore-sight offsets (avoid using) -------------------
    # Leave at zero. If you find yourself tuning these to "fix" pitch error,
    # the underlying calibration is wrong instead. See docs/calibration_guide.md.
    pitch_offset_deg: 0.0
    yaw_offset_deg: 0.0

    # ------------------- Optional flags (P4+, default off) -------------------
    enable_pnp_refine: false
    enable_anti_gyro: false
    enable_adaptive_q: false
    enable_adaptive_r: false

    # ------------------- Debug / profiling -------------------
    "debug.publish_enabled": true
    "debug.histogram_log_enabled": true
    "debug.publish_markers": true
    "debug.fire_log_period_s": 10.0
    "fire.enable_pose_gate": true
