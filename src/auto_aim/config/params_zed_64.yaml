# Auto-aim parameters for the 64 Jetson + Stereolabs Zed robot.
#
# Use this file with the auto_aim_zed_64.launch.py launch file. Values below
# override the C++ defaults in TrackerConfig and the node parameters.
#
# Where two robots have different physical geometry, override per-robot values
# here. Do NOT mask measurement errors with bore-sight offsets — see
# docs/calibration_guide.md.

auto_aim:
  ros__parameters:
    # ------------------- Detection / tracking -------------------
    target_classes: ["0"]
    keypoint_topic: "/detector/armors_keypoints"
    min_keypoint_score: 0.30
    keypoint_max_reproj_error: 15.0
    "pnp.force_armor_size": "auto"
    "pnp.size_switch_margin_px": 0.50
    enable_pnp_health_gate: false
    pnp_max_reproj_err_norm: 0.10
    pnp_min_depth_m: 0.10
    pnp_max_depth_m: 12.0
    enable_keypoint_geometry_check: true
    # Legacy bbox-PnP parameter; unused on the keypoint path.
    light_ratio: 0.85
    max_armor_distance: 8.0
    max_armor_z: 1.2

    # State machine
    confirm_frames: 3
    lost_timeout: 0.4

    # EKF process noise
    q_pos: 5.0
    q_yaw: 10.0
    q_r:  1.0e-6

    # EKF measurement noise
    r_pos_base: 0.05
    r_pos_slope: 0.04
    r_yaw_base: 0.05
    r_yaw_slope: 0.005
    max_oblique_deg: 65.0

    # Velocity damping
    alpha_pos: 0.90
    alpha_yaw: 0.90
    alpha_coast: 0.70

    # Armor geometry
    initial_radius: 0.24
    radius_ema_alpha: 0.05

    # ------------------- Ballistics / physical -------------------
    # MEASURE bullet speed on the 64 robot. Default 25 m/s is a placeholder.
    bullet_speed: 25.0
    gravity: 9.8

    # 64 Jetson + Zed robot geometry. The Zed lens is typically larger than a
    # RealSense and may sit slightly higher / further forward — re-measure on
    # the actual chassis. Defaults below copy the 16 robot and MUST be tuned.
    gimbal_height: 0.325
    barrel_offset_x: 0.0
    barrel_offset_y: 0.0
    barrel_offset_z: -0.10

    # ------------------- Fire gate -------------------
    angular_window: 0.09
    "fire.alignment_source": "camera_angle"
    window_ref_dist: 3.0
    min_fire_dist: 0.3
    max_fire_dist: 8.0

    # ------------------- Timing -------------------
    # Zed nominal rate is often 30 or 60 Hz depending on resolution. Keep
    # ref_freq at the actual detector publish rate.
    time_bias: 0.05
    ref_freq: 30.0

    # ------------------- Match / association -------------------
    max_match_dist: 0.5
    maha_threshold: 13.3
    face_jump_max_match_dist_ratio: 1.5
    face_jump_min_yaw: 0.78539816339
    face_jump_max_yaw: 2.35619449019

    # ------------------- Target switching -------------------
    switch_range_ratio: 0.85
    switch_cooldown: 10
    enable_tracking_switch: false
    tracking_switch_range_ratio: 0.80

    # ------------------- Command shaping -------------------
    cmd_smooth_alpha: 0.4
    "cmd.temp_lost_coast_max_s": 0.08

    # ------------------- Gimbal sign convention -------------------
    "gimbal.yaw_sign": 1.0
    "gimbal.pitch_sign": 1.0
    # /micro_imu must be fresh because it defines the camera->odom transform
    # and the current gimbal angles used by the fire gate.
    "micro_imu.stale_threshold_s": 0.25

    # ------------------- Bore-sight offsets (avoid using) -------------------
    pitch_offset_deg: 0.0
    yaw_offset_deg: 0.0

    # ------------------- Optional flags (P4+, default off) -------------------
    enable_pnp_refine: false
    enable_anti_gyro: false
    enable_adaptive_q: false
    enable_adaptive_r: false

    # ------------------- Debug / profiling -------------------
    "debug.publish_enabled": true
    "debug.histogram_log_enabled": true
    "debug.publish_markers": true
    "debug.fire_log_period_s": 10.0
    "fire.enable_pose_gate": true
