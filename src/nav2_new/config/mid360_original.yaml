# =============================================================================
# FAST_LIO config for Livox Mid-360 — LiDAR MOUNTED FLIPPED (UPSIDE-DOWN)
# =============================================================================
# The LiDAR's body has been rotated 180° about the X-axis ("roll 180°"):
# the connector that used to point "backwards and up" now points "backwards
# and down" and the top of the sensor is on the bottom.
#
# Two effects on the raw point cloud:
#   1. Y axis is flipped (left/right swapped)
#   2. Z axis is flipped (up/down swapped)
#
# The extrinsic_R matrix compensates for this so FAST_LIO publishes odometry
# in a normal right-handed frame where +X = robot forward, +Z = up.
#
# ── Common mounting choices (pick the one matching your hardware) ───────────
#   • FLIP (upside-down, 180° about X):  [ 1, 0, 0,  0,-1, 0,  0, 0,-1]  ← DEFAULT
#   • 180° YAW (connector forward, 180° about Z): [-1, 0, 0,  0,-1, 0,  0, 0, 1]
#   • NORMAL  (no rotation):             [ 1, 0, 0,  0, 1, 0,  0, 0, 1]
#
# 🔁  If you change this matrix, you MUST also change the static TF in
#     launch/sensors.launch.py so /scan and /odom agree. See README.
# =============================================================================

/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1                # 1 = Livox
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en: false

            # LiDAR → IMU translation (measure on your robot)
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]

            # ── 180° about X (UPSIDE-DOWN) ─────────────────────────────
            extrinsic_R: [ 1.,  0.,  0.,
                           0., -1.,  0.,
                           0.,  0., -1. ]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true
            interval: -1
