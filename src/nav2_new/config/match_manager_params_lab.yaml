# Snippet da copiare nel tuo match_manager_params_lab.yaml.
# Cambia center_free_strategy con il nome reale della strategia che deve andare in loop
# se nel tuo arena_waypoints_lab.yaml si chiama diversamente, per esempio hold_center_diagonal.

waypoint_manager:
  ros__parameters:
    team: red
    waypoints_file: /root/nav2_ws/src/nav2_new/config/arena_waypoints_lab.yaml
    initial_strategy: wait_at_spawn
    autostart_initial_strategy: true
    execute_waypoints_sequentially: true

    # SOLO questa strategia va in loop.
    loop_strategies:
      - center_free_strategy

    retry_failed_after_sec: 3.0


game_state_manager:
  ros__parameters:
    waypoints_file: /root/nav2_ws/src/nav2_new/config/arena_waypoints_lab.yaml
    default_team: red
    use_team_topic: true

    wait_strategy: wait_at_spawn
    approach_strategy: percorso
    loop_strategy: center_free_strategy
    retreat_strategy: retreat_to_spawn

    # Se < 0 legge health.retreat_threshold dal file arena_waypoints_lab.yaml.
    retreat_health_threshold: -1.0
    retreat_wait_sec: 4.0
    allow_repeated_retreats: true
    retreat_cooldown_sec: 8.0

    # false: dopo retreat_wait_sec torna a percorso anche se /health non si è ancora aggiornato.
    # true: resta allo spawn finché hp >= retreat_health_threshold + health_recover_margin.
    return_requires_health_recovered: false
    health_recover_margin: 5.0

    strategy_republish_sec: 3.0
    tick_hz: 5.0
    reset_on_match_end: true