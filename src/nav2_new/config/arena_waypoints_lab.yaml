# =============================================================================
# Lab arena — waypoints, strategies, and health thresholds
# =============================================================================

spawns:
  red:  { x: 0.667, y: -0.077, yaw: 1.525 }
  blue: { x: 0.667, y: -0.077, yaw: 1.525 }

waypoints:
  spawn_lab:       { x: 0.667, y: -0.077, yaw: 1.525 }
  fine_corridoio:  { x: 3.444, y: 0.381, yaw: 0.000 }
  centro_lab:      { x: 3.508, y: 6.240, yaw: 0.000 }
  scrivania_Leo:   { x: 3.622, y: 2.375, yaw: 0.000 }
  diagonale_1 :    { x: -0.787, y: 2.140, yaw: 0.000 }
  diagonale_2:    { x: 0.246, y: 0.596, yaw: 0.000 }
  diagonale_1_centro:    { x: -0.114, y: 6.158, yaw: 0.000 }
  diagonale_2_centro:    { x: 3.411, y: 6.107, yaw: 0.000 }

health:
  retreat_threshold: 120.0

strategies:
  wait_at_spawn:
    red:  [spawn_lab]
    blue: [spawn_lab]

  # Percorso di andata/ritorno dalla base verso la zona di gioco/centro.
  percorso:
    red:  [fine_corridoio, centro_lab]
    blue: [fine_corridoio, centro_lab]

  # Questa è la strategia che deve ripetersi in loop.
  # Se la tua si chiama hold_center_diagonal, usa quel nome anche nei parametri sopra.
  center_free_strategy:
    red:  [diagonale_1_centro, diagonale_2_centro]
    blue: [diagonale_1_centro, diagonale_2_centro]

  retreat_to_spawn:
    red:  [spawn_lab]
    blue: [spawn_lab]

turret_idle_targets:
  red: centro_lab
  blue: centro_lab


# --- Arena metadata (for documentation only) --------------------------------
arena:
  width_m: 12.0
  height_m: 8.0
  capture_point:
    size_m: 2.0
    center: { x: 6.0, y: 4.0 }
  notes: |
    - The black textured areas at the BOTTOM of the arena are bumper pads.
      They are soft and uneven — DO NOT drive over them. Map them as obstacles
      during SLAM (drive around them, not onto them) and they will show up as
      walls in the occupancy grid.
    - The spawn squares are raised ~15 cm; the robot is dropped into them at
      match start. Don't plan paths that re-enter the spawn square (the edge
      may cause a step).
    - The tunnel gap between the two central walls is estimated at ~0.7–1.0 m
      wide. Tune `inflation_radius` in nav2_params_combat.yaml accordingly.
