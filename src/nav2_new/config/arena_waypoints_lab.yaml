# =============================================================================
# Lab arena — waypoints, strategies, and health thresholds
# =============================================================================

spawns:
  red:  { x: 0.667, y: -0.077, yaw: 1.525 }
  blue: { x: 0.667, y: -0.077, yaw: 1.525 }

waypoints:
  spawn_lab:       { x: 0.667, y: -0.077, yaw: 1.525 }
  fine_corridoio:  { x: 3.444, y: 0.381, yaw: 0.000 }
  centro_lab:      { x: 3.508, y: 6.240, yaw: 0.000 }
  scrivania_Leo:   { x: 3.622, y: 2.375, yaw: 0.000 }

strategies:

  # Il robot resta nello spawn.
  wait_at_spawn:
    red:  [spawn_lab]
    blue: [spawn_lab]

  # Strategia principale quando parte il match.
  rush_center:
    red:  [centro_lab, scrivania_Leo,fine_corridoio]
    blue: [centro_lab, scrivania_Leo,fine_corridoio]

  # Ritorno zona sicura/spawn quando HP bassa.
  retreat_to_spawn:
    red:  [spawn_lab]
    blue: [spawn_lab]

  # Dopo 4 secondi allo spawn torna verso il centro.
  after_retreat:
    red:  [fine_corridoio]
    blue: [fine_corridoio]

  # Centro libero: test semplice, vai al centro.
  center_free_strategy:
    red:  [centro_lab]
    blue: [centro_lab]

  # Centro nostro: test diagonale/laterale.
  hold_center_diagonal:
    red:  [scrivania_Leo]
    blue: [scrivania_Leo]

  # Centro occupato da nemico: strategia alternativa.
  enemy_center_strategy:
    red:  [fine_corridoio]
    blue: [fine_corridoio]

  # Strategie tue originali, puoi tenerle.
  centro_lab:
    red:  [centro_lab]
    blue: [centro_lab]

  percorso:
    red:  [fine_corridoio, centro_lab, scrivania_Leo]
    blue: [fine_corridoio, centro_lab, scrivania_Leo]

health:
  retreat_threshold: 30
  safe_threshold: 70
  low_hp_strategy: retreat_to_spawn
  default_strategy: rush_center
  hold_strategy: hold_center_diagonal

turret_idle_targets:
  red: fine_corridoio
  blue: fine_corridoio


# --- Arena metadata (for documentation only) --------------------------------
arena:
  width_m: 12.0
  height_m: 8.0
  capture_point:
    size_m: 2.0
    center: { x: 6.0, y: 4.0 }
  notes: |
    - The black textured areas at the BOTTOM of the arena are bumper pads.
      They are soft and uneven — DO NOT drive over them. Map them as obstacles
      during SLAM (drive around them, not onto them) and they will show up as
      walls in the occupancy grid.
    - The spawn squares are raised ~15 cm; the robot is dropped into them at
      match start. Don't plan paths that re-enter the spawn square (the edge
      may cause a step).
    - The tunnel gap between the two central walls is estimated at ~0.7–1.0 m
      wide. Tune `inflation_radius` in nav2_params_combat.yaml accordingly.
