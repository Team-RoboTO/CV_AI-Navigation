amcl:
  ros__parameters:
    use_sim_time: false
    min_particles: 1000          # CHANGED was 500  (more coverage on symmetric map)
    max_particles: 6000          # CHANGED was 3000
    # Motion-model noise. alpha1/alpha2 raised a lot: with the head rotating
    # independently, the particle cloud MUST spread enough in yaw to contain
    # the true pose, otherwise a resample collapses it onto the wrong mode.
    alpha1: 0.8                  # CHANGED was 0.2  <-- KEY for rotation-from-stationary
    alpha2: 0.5                  # CHANGED was 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1                  # CHANGED was 0.2
    base_frame_id: "base_stable"   # CHANGED was base_link -> use the non-rotating frame from amcl_scan_stabilizer (Approach B)
    global_frame_id: "map"
    odom_frame_id: "odom"
    robot_model_type: "nav2_amcl::OmniMotionModel"
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0   # CHANGED was 1.0 (easier re-lock after rotation)
    laser_max_range: 4.0
    laser_min_range: 0.20
    max_beams: 80
    # Softer measurement model so a slightly imperfect scan during motion does
    # not zero out particle weights and trigger a collapse.
    sigma_hit: 0.3               # CHANGED was 0.2
    z_hit: 0.55                  # CHANGED was 0.7
    z_max: 0.05
    z_rand: 0.4                  # CHANGED was 0.2
    z_short: 0.05
    update_min_a: 0.1            # CHANGED was 1000.0  <-- re-enable rotation updates
    update_min_d: 0.15           # CHANGED was 0.15
    resample_interval: 1         # CHANGED was 1 (don't resample every update -> less collapse)
    transform_tolerance: 1.0     # CHANGED was 0.5 (covers lag during fast motion)
    tf_broadcast: true
    scan_topic: /scan_amcl       # CHANGED was /scan -> de-rotated scan from amcl_scan_stabilizer (Approach B)
    set_initial_pose: false
    # Augmented-MCL recovery: inject random particles if the cloud degenerates,
    # so a lost filter can recover instead of staying stuck (the screenshot case).
    recovery_alpha_slow: 0.001   # CHANGED was 0.0 (disabled)
    recovery_alpha_fast: 0.1     # CHANGED was 0.0 (disabled)

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0 # old 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.2
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 8.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: -2.5
      max_vel_x: 2.5
      min_vel_y: -2.5
      max_vel_y: 2.5
      max_vel_theta: 0.0
      min_speed_xy: 0.10
      max_speed_xy: 2.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 2.5
      acc_lim_theta: 0.0
      decel_lim_x: -2.5
      decel_lim_y: -2.5
      decel_lim_theta: 0.0
      vx_samples: 21
      vy_samples: 21
      vtheta_samples: 1
      sim_time: 0.50 # old 0.45
      linear_granularity: 0.03
      angular_granularity: 0.025
      transform_tolerance: 2.0
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["Oscillation", "BaseObstacle", "ObstacleFootprint", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.015
      #PathAlign.scale: 16.0
      PathDist.scale: 18.0 # old 32.0
      GoalDist.scale: 10.0 # old 12.0
      ObstacleFootprint.scale: 0.015 # old 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 2.0
      update_frequency: 15.0
      publish_frequency: 8.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.20
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 4.0

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 2.0
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      robot_radius: 0.22
      track_unknown_space: false
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        lethal_cost_threshold: 65
        trinary_costmap: true


      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 8.0

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 2.0

    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    simulate_ahead_time: 2.0
    max_rotational_vel: 0.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [2.5, 2.5, 0.0]
    min_velocity: [-2.5, -2.5, 0.0]
    max_accel: [2.5, 2.5, 0.0]
    max_decel: [-2.5, -2.5, 0.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0